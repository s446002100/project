<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إهداء </title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

overflow:hidden;

background:
linear-gradient(
135deg,
#fff5f6,
#ffeef2,
#fff
);

}

.float{

position:absolute;

bottom:-50px;

font-size:28px;

animation:
up linear infinite;

}

@keyframes up{

100%{

transform:
translateY(-120vh)
rotate(360deg);

}

}

.card{

width:100%;
max-width:420px;

padding:35px;

border-radius:30px;

text-align:center;

background:
rgba(
255,
255,
255,
0.65
);

backdrop-filter:blur(15px);

}

h1{

color:#c97790;

margin-bottom:15px;

}

p{

line-height:2;

margin-bottom:20px;

}

/* مشغل الصوت */

audio{

width:100%;

border-radius:20px;

}

</style>

</head>

<body>

<div class="float"
style="left:10%;animation:up 8s infinite linear;">
🤍
</div>

<div class="float"
style="left:30%;animation:up 10s infinite linear;">
🌸
</div>

<div class="float"
style="left:60%;animation:up 9s infinite linear;">
🌷
</div>

<div class="float"
style="left:80%;animation:up 12s infinite linear;">
🌹
</div>

<div class="card">

<h1>
🤍
</h1>

<p>

ضع عبارتك هنا ✨

</p>

<audio controls autoplay loop>

<source
src="ahmad.mp3"
type="audio/mpeg">

</audio>

</div>

</body>

</html>
